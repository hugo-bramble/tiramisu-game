<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chelsea Tiramisu Challenge — Beat 275m</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #2a1810; color: #f5e6d3; touch-action: none; }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: linear-gradient(180deg, #3d2817, #2a1810); border-bottom: 2px solid #6b4423; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  h1 { font-size: 16px; font-weight: 700; color: #f5e6d3; letter-spacing: 0.5px; }
  .stats { display: flex; gap: 14px; font-size: 13px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-label { font-size: 10px; color: #c9a87c; text-transform: uppercase; letter-spacing: 1px; }
  .stat-value { font-size: 15px; font-weight: 700; color: #ffd89b; }
  #stage { flex: 1; position: relative; overflow: hidden; background: linear-gradient(180deg, #4a3020 0%, #2a1810 100%); }
  #tray { position: absolute; bottom: 80px; left: 0; right: 0; height: 100px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; white-space: nowrap; padding: 10px 0; scrollbar-width: none; }
  #tray::-webkit-scrollbar { display: none; }
  #tiramisu { display: inline-flex; align-items: flex-end; height: 80px; padding: 0 50vw; }
  .layer { display: inline-block; height: 22px; min-width: 38px; margin: 0 -1px; border-radius: 3px; vertical-align: bottom; position: relative; animation: drop 0.3s ease-out; transform-origin: bottom; }
  @keyframes drop { from { transform: translateY(-30px) scale(0.8); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .lady { background: linear-gradient(180deg, #d4a574 0%, #b8895a 100%); height: 18px; box-shadow: inset 0 1px 0 #e6c391, 0 1px 2px rgba(0,0,0,0.3); }
  .lady::before { content: ''; position: absolute; inset: 2px 4px; background: repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(0,0,0,0.08) 4px, rgba(0,0,0,0.08) 5px); border-radius: 1px; }
  .cream { background: linear-gradient(180deg, #fff8dc 0%, #f5e6c8 100%); height: 16px; box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.2); }
  .cocoa { background: linear-gradient(180deg, #5d3a1f 0%, #3d2817 100%); height: 8px; box-shadow: inset 0 1px 0 #7a4f2a; }
  .cocoa::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 50%, rgba(0,0,0,0.4) 1px, transparent 2px), radial-gradient(circle at 60% 30%, rgba(0,0,0,0.3) 1px, transparent 2px), radial-gradient(circle at 80% 70%, rgba(0,0,0,0.4) 1px, transparent 2px); }
  .perfect { animation: drop 0.3s ease-out, glow 0.6s ease-out; }
  @keyframes glow { 0%, 100% { box-shadow: inset 0 1px 0 #fff, 0 0 0 rgba(255,216,155,0); } 50% { box-shadow: inset 0 1px 0 #fff, 0 0 20px rgba(255,216,155,0.9); } }
  #meter { position: absolute; bottom: 200px; left: 16px; right: 16px; height: 50px; background: rgba(0,0,0,0.4); border-radius: 25px; border: 2px solid #6b4423; overflow: hidden; }
  #meter-zones { position: absolute; inset: 0; display: flex; }
  .zone { height: 100%; }
  .zone.bad { background: rgba(180,60,60,0.3); flex: 2; }
  .zone.good { background: rgba(200,160,80,0.3); flex: 2; }
  .zone.perfect { background: rgba(80,200,120,0.4); flex: 1; }
  #meter-marker { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; box-shadow: 0 0 10px #fff; left: 0; transition: none; }
  #order { position: absolute; top: 16px; left: 16px; right: 16px; background: rgba(0,0,0,0.5); padding: 10px 14px; border-radius: 10px; border: 1px solid #6b4423; font-size: 12px; }
  #order-label { font-size: 10px; color: #c9a87c; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  #order-text { font-size: 14px; font-weight: 600; color: #ffd89b; }
  #controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 16px 24px; background: linear-gradient(0deg, #1a0e08, transparent); display: flex; gap: 10px; }
  .btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; color: #2a1810; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.1s; box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
  .btn-lady { background: linear-gradient(180deg, #e6c391, #b8895a); }
  .btn-cream { background: linear-gradient(180deg, #fff8dc, #f5e6c8); }
  .btn-cocoa { background: linear-gradient(180deg, #8b5a2b, #5d3a1f); color: #f5e6d3; }
  #toast { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); padding: 8px 18px; background: rgba(255,216,155,0.95); color: #2a1810; border-radius: 20px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }
  #gameover { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 30; padding: 20px; }
  #gameover.show { display: flex; }
  #gameover h2 { font-size: 28px; color: #ffd89b; text-align: center; }
  #gameover p { font-size: 16px; text-align: center; color: #f5e6d3; }
  #gameover .final { font-size: 48px; font-weight: 900; color: #ffd89b; text-shadow: 0 2px 10px rgba(255,216,155,0.5); }
  .restart { padding: 14px 32px; background: linear-gradient(180deg, #ffd89b, #c9a87c); color: #2a1810; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="game">
  <header>
    <h1>🍰 CHELSEA TIRAMISU</h1>
    <div class="stats">
      <div class="stat"><span class="stat-label">Length</span><span class="stat-value" id="length">0m</span></div>
      <div class="stat"><span class="stat-label">Combo</span><span class="stat-value" id="combo">×1</span></div>
      <div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="lives">♥♥♥</span></div>
    </div>
  </header>
  <div id="stage">
    <div id="order">
      <div id="order-label">Chelsea Town Hall — beat 275m</div>
      <div id="order-text">Ladyfinger</div>
    </div>
    <div id="meter">
      <div id="meter-zones">
        <div class="zone bad"></div>
        <div class="zone good"></div>
        <div class="zone perfect"></div>
        <div class="zone good"></div>
        <div class="zone bad"></div>
      </div>
      <div id="meter-marker"></div>
    </div>
    <div id="tray"><div id="tiramisu"></div></div>
    <div id="toast"></div>
    <div id="controls">
      <button class="btn btn-lady" data-type="lady">Ladyfinger</button>
      <button class="btn btn-cream" data-type="cream">Mascarpone</button>
      <button class="btn btn-cocoa" data-type="cocoa">Cocoa</button>
    </div>
    <div id="gameover">
      <h2>Service Over!</h2>
      <p>Your tiramisu measured</p>
      <div class="final" id="final-length">0cm</div>
      <p id="verdict"></p>
      <button class="restart" onclick="restart()">Build Another</button>
    </div>
  </div>
</div>
<script>
const ORDER = ['lady','cream','lady','cream','cocoa'];
const NAMES = { lady:'Ladyfinger', cream:'Mascarpone', cocoa:'Cocoa dust' };
const CM = { lady:120, cream:90, cocoa:50 };
const RECORD_CM = 27500;

let state;
const tiramisu = document.getElementById('tiramisu');
const tray = document.getElementById('tray');
const orderText = document.getElementById('order-text');
const lengthEl = document.getElementById('length');
const comboEl = document.getElementById('combo');
const livesEl = document.getElementById('lives');
const marker = document.getElementById('meter-marker');
const meter = document.getElementById('meter');
const toast = document.getElementById('toast');
const gameover = document.getElementById('gameover');
const finalLength = document.getElementById('final-length');
const verdict = document.getElementById('verdict');

function init() {
  state = { layers: 0, length: 0, combo: 1, lives: 3, orderIdx: 0, markerPos: 0, markerDir: 1, speed: 0.8, running: true };
  tiramisu.innerHTML = '';
  updateUI();
  gameover.classList.remove('show');
  requestAnimationFrame(tick);
}

function fmtLen(cm) {
  if (cm < 100) return cm.toFixed(0) + 'cm';
  return (cm / 100).toFixed(cm < 1000 ? 2 : 1) + 'm';
}

function updateUI() {
  lengthEl.textContent = fmtLen(state.length);
  comboEl.textContent = '×' + state.combo;
  livesEl.textContent = '♥'.repeat(state.lives) + '♡'.repeat(3 - state.lives);
  orderText.textContent = NAMES[ORDER[state.orderIdx]];
}

function tick() {
  if (!state.running) return;
  state.markerPos += state.markerDir * state.speed;
  if (state.markerPos >= 100) { state.markerPos = 100; state.markerDir = -1; }
  if (state.markerPos <= 0) { state.markerPos = 0; state.markerDir = 1; }
  marker.style.left = state.markerPos + '%';
  requestAnimationFrame(tick);
}

function showToast(msg, color) {
  toast.textContent = msg;
  toast.style.background = color || 'rgba(255,216,155,0.95)';
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove('show'), 800);
}

function place(type) {
  if (!state.running) return;
  const expected = ORDER[state.orderIdx];
  const correctOrder = type === expected;
  const p = state.markerPos;
  let quality, mult, label;
  if (p >= 40 && p <= 60) { quality = 'perfect'; mult = 2.0; label = 'PERFECT!'; }
  else if (p >= 20 && p <= 80) { quality = 'good'; mult = 1.0; label = 'Good'; }
  else { quality = 'bad'; mult = 0.4; label = 'Sloppy'; }

  if (!correctOrder) {
    state.lives--;
    state.combo = 1;
    showToast('Wrong layer! Recipe broken', 'rgba(220,100,100,0.95)');
    if (navigator.vibrate) navigator.vibrate(80);
    if (state.lives <= 0) return endGame();
    updateUI();
    return;
  }

  if (quality === 'perfect') state.combo = Math.min(state.combo + 1, 9);
  else if (quality === 'good') state.combo = Math.max(1, state.combo);
  else state.combo = 1;

  const gained = CM[type] * mult * (1 + (state.combo - 1) * 0.15);
  state.length += gained;

  const div = document.createElement('div');
  div.className = 'layer ' + type + (quality === 'perfect' ? ' perfect' : '');
  div.style.minWidth = (38 * mult) + 'px';
  tiramisu.appendChild(div);
  state.layers++;
  state.orderIdx = (state.orderIdx + 1) % ORDER.length;
  state.speed = Math.min(2.8, 0.8 + state.layers * 0.04);

  showToast(label + ' +' + fmtLen(gained) + (state.combo > 1 ? ' ×' + state.combo : ''),
    quality === 'perfect' ? 'rgba(140,230,160,0.95)' : quality === 'good' ? 'rgba(255,216,155,0.95)' : 'rgba(220,180,100,0.9)');

  if (navigator.vibrate) navigator.vibrate(quality === 'perfect' ? [10,30,10] : 15);

  tray.scrollTo({ left: tray.scrollWidth, behavior: 'smooth' });
  updateUI();
}

function endGame() {
  state.running = false;
  finalLength.textContent = fmtLen(state.length);
  const m = state.length / 100;
  let v = '';
  if (m < 10) v = 'Barely a starter. Chelsea Town Hall awaits…';
  else if (m < 50) v = 'A respectable spread, but not record-breaking.';
  else if (m < 150) v = 'Halfway to glory! Keep stacking.';
  else if (m < 275) v = 'So close to the 275m record — try again!';
  else if (m < 400) v = '🏆 NEW WORLD RECORD! Chelsea Town Hall erupts!';
  else v = '🏆🇮🇹 LEGENDARY! ' + m.toFixed(0) + 'm of pure tiramisu glory!';
  verdict.textContent = v;
  gameover.classList.add('show');
}

function restart() { init(); }

document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('touchstart', e => { e.preventDefault(); place(b.dataset.type); }, { passive: false });
  b.addEventListener('click', e => { if (!('ontouchstart' in window)) place(b.dataset.type); });
});

document.addEventListener('gesturestart', e => e.preventDefault());

init();
</script>
</body>
</html>
