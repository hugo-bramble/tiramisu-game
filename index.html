<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a0e08">
<title>Chelsea Tiramisu Challenge — Beat 275m</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; overflow: hidden; font-family: "Georgia", "Times New Roman", serif; background: #1a0e08; color: #f5e6d3; touch-action: none; }
  #game { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ITALIAN FLAG BUNTING */
  #bunting { position: absolute; top: 0; left: 0; right: 0; height: 14px; display: flex; z-index: 5; pointer-events: none; }
  #bunting span { flex: 1; height: 100%; }
  #bunting span:nth-child(3n+1) { background: #008c45; }
  #bunting span:nth-child(3n+2) { background: #f4f5f0; }
  #bunting span:nth-child(3n+3) { background: #cd212a; }

  header { padding: 22px 14px 10px; background: linear-gradient(180deg, #3d2817 0%, #2a1810 100%); border-bottom: 2px solid #6b4423; display: flex; justify-content: space-between; align-items: center; z-index: 10; box-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  h1 { font-size: 15px; font-weight: 700; color: #ffd89b; letter-spacing: 0.5px; font-style: italic; }
  h1 .accent { color: #cd212a; }
  .stats { display: flex; gap: 12px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-label { font-size: 9px; color: #c9a87c; text-transform: uppercase; letter-spacing: 1px; font-family: -apple-system, sans-serif; font-weight: 600; }
  .stat-value { font-size: 16px; font-weight: 700; color: #ffd89b; font-family: -apple-system, sans-serif; }

  #stage { flex: 1; position: relative; overflow: hidden; background: linear-gradient(180deg, #6b4423 0%, #3d2817 50%, #2a1810 100%); }

  /* CHELSEA TOWN HALL SILHOUETTE */
  #townhall { position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%); width: 280px; height: 100px; opacity: 0.18; pointer-events: none; }

  /* CROWD */
  #crowd { position: absolute; bottom: 200px; left: 0; right: 0; height: 30px; pointer-events: none; opacity: 0.5; }
  .head { position: absolute; bottom: 0; width: 14px; height: 22px; border-radius: 50% 50% 30% 30%; background: #1a0e08; }
  .head::after { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50%; background: #1a0e08; }

  /* NONNA */
  #nonna { position: absolute; top: 70px; right: 12px; width: 64px; height: 64px; z-index: 8; }
  #nonna-svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5)); transition: transform 0.2s; }
  #nonna.happy #nonna-svg { transform: scale(1.05) rotate(-3deg); }
  #nonna.sad #nonna-svg { transform: scale(0.95) rotate(2deg); }
  #nonna.furious #nonna-svg { animation: shake 0.3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-5deg); } 75% { transform: translateX(4px) rotate(5deg); } }

  #bubble { position: absolute; top: 76px; right: 84px; max-width: 160px; padding: 8px 12px; background: #fff8dc; color: #2a1810; border-radius: 14px; font-size: 13px; font-weight: 700; font-style: italic; opacity: 0; transition: opacity 0.2s, transform 0.2s; transform: translateX(10px); z-index: 8; box-shadow: 0 3px 8px rgba(0,0,0,0.4); pointer-events: none; }
  #bubble.show { opacity: 1; transform: translateX(0); }
  #bubble::after { content: ''; position: absolute; right: -8px; top: 14px; width: 0; height: 0; border-left: 10px solid #fff8dc; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

  /* RECORD PROGRESS */
  #record-bar { position: absolute; top: 80px; left: 14px; right: 90px; height: 30px; background: rgba(0,0,0,0.5); border-radius: 15px; border: 1.5px solid #6b4423; overflow: hidden; }
  #record-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #008c45 0%, #f4f5f0 50%, #cd212a 100%); transition: width 0.4s ease-out; border-radius: 13px; }
  #record-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); font-family: -apple-system, sans-serif; letter-spacing: 0.5px; }
  #record-line { position: absolute; top: -3px; bottom: -3px; left: 100%; width: 3px; background: #ffd700; box-shadow: 0 0 8px #ffd700; }
  #record-line::after { content: '275m'; position: absolute; top: -14px; right: 0; font-size: 9px; color: #ffd700; font-family: -apple-system, sans-serif; font-weight: 700; }

  /* TIRAMISU TRAY */
  #tray { position: absolute; bottom: 90px; left: 0; right: 0; height: 110px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; white-space: nowrap; padding: 14px 0 8px; scrollbar-width: none; }
  #tray::-webkit-scrollbar { display: none; }
  #tiramisu { display: inline-flex; align-items: flex-end; height: 90px; padding: 0 50vw; }
  .layer { display: inline-block; min-width: 40px; margin: 0 -1px; border-radius: 2px; vertical-align: bottom; position: relative; animation: drop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: bottom; }
  @keyframes drop { from { transform: translateY(-40px) scale(0.7) rotate(-8deg); opacity: 0; } to { transform: translateY(0) scale(1) rotate(0); opacity: 1; } }
  .lady { height: 20px; background: linear-gradient(180deg, #e6c391 0%, #b8895a 100%); box-shadow: inset 0 1px 0 #f0d4a8, 0 1px 2px rgba(0,0,0,0.3); }
  .lady::before { content: ''; position: absolute; inset: 2px 3px; background: repeating-linear-gradient(90deg, transparent 0, transparent 5px, rgba(0,0,0,0.12) 5px, rgba(0,0,0,0.12) 6px); border-radius: 1px; }
  .cream { height: 18px; background: linear-gradient(180deg, #fffaf0 0%, #f5e6c8 100%); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,0.2); }
  .cream::before { content: ''; position: absolute; top: -2px; left: 0; right: 0; height: 4px; background: radial-gradient(circle at 25% 50%, #fffaf0 2px, transparent 3px), radial-gradient(circle at 50% 50%, #fffaf0 2px, transparent 3px), radial-gradient(circle at 75% 50%, #fffaf0 2px, transparent 3px); }
  .cocoa { height: 9px; background: linear-gradient(180deg, #5d3a1f 0%, #3d2817 100%); box-shadow: inset 0 1px 0 #7a4f2a; }
  .cocoa::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle at 15% 50%, rgba(255,255,255,0.15) 1px, transparent 2px), radial-gradient(circle at 45% 30%, rgba(0,0,0,0.4) 1px, transparent 2px), radial-gradient(circle at 75% 70%, rgba(0,0,0,0.4) 1px, transparent 2px), radial-gradient(circle at 90% 40%, rgba(255,255,255,0.1) 1px, transparent 2px); }
  .perfect { animation: drop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), glow 0.8s ease-out; }
  @keyframes glow { 0%, 100% { box-shadow: inset 0 1px 0 #fff, 0 0 0 rgba(255,216,155,0); } 50% { box-shadow: inset 0 1px 0 #fff, 0 0 24px 4px rgba(255,216,155,1); } }

  /* PARTICLES */
  .particle { position: absolute; pointer-events: none; font-size: 18px; animation: pop 0.9s ease-out forwards; }
  @keyframes pop { 0% { transform: translate(0,0) scale(0.5); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }

  /* TIMING METER */
  #meter { position: absolute; bottom: 215px; left: 14px; right: 14px; height: 44px; background: rgba(0,0,0,0.5); border-radius: 22px; border: 2px solid #6b4423; overflow: hidden; }
  #meter-zones { position: absolute; inset: 0; display: flex; }
  .zone { height: 100%; }
  .zone.bad { background: rgba(180,60,60,0.35); flex: 2; }
  .zone.good { background: rgba(200,160,80,0.35); flex: 2; }
  .zone.perfect { background: linear-gradient(90deg, rgba(80,200,120,0.5), rgba(120,230,150,0.6)); flex: 1; box-shadow: inset 0 0 10px rgba(255,216,155,0.4); }
  #meter-marker { position: absolute; top: -2px; bottom: -2px; width: 5px; background: #fff; box-shadow: 0 0 14px #fff, 0 0 4px #ffd89b; left: 0; border-radius: 2px; }
  #meter-label { position: absolute; left: 14px; top: -16px; font-size: 9px; color: #c9a87c; text-transform: uppercase; letter-spacing: 1.5px; font-family: -apple-system, sans-serif; font-weight: 700; }

  /* CONTROLS */
  #controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 12px 22px; background: linear-gradient(0deg, #0a0503 60%, transparent); display: flex; gap: 8px; }
  .btn { flex: 1; padding: 14px 4px; border: none; border-radius: 14px; font-size: 11px; font-weight: 800; color: #2a1810; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.08s; box-shadow: 0 4px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4); font-family: -apple-system, sans-serif; position: relative; overflow: hidden; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4); }
  .btn-icon { display: block; font-size: 22px; margin-bottom: 2px; }
  .btn-lady { background: linear-gradient(180deg, #f0d4a8, #b8895a); }
  .btn-cream { background: linear-gradient(180deg, #fffaf0, #f5e6c8); }
  .btn-cocoa { background: linear-gradient(180deg, #8b5a2b, #5d3a1f); color: #f5e6d3; }
  .btn.next-up { animation: pulseBtn 0.9s ease-in-out infinite; }
  @keyframes pulseBtn { 0%, 100% { box-shadow: 0 4px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4), 0 0 0 0 rgba(255,216,155,0.6); } 50% { box-shadow: 0 4px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.4), 0 0 0 8px rgba(255,216,155,0); } }

  /* ESPRESSO POWERUP */
  #espresso { position: absolute; bottom: 90px; right: 14px; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #4a2818, #2a1810); border: 2px solid #ffd700; display: none; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; box-shadow: 0 0 20px rgba(255,215,0,0.5); animation: bounce 1.5s ease-in-out infinite; z-index: 9; }
  #espresso.show { display: flex; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  /* TOAST */
  #toast { position: absolute; top: 130px; left: 50%; transform: translateX(-50%) translateY(-10px); padding: 10px 22px; background: rgba(255,216,155,0.97); color: #2a1810; border-radius: 24px; font-weight: 800; font-size: 16px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 20; font-style: italic; box-shadow: 0 4px 14px rgba(0,0,0,0.4); white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* MILESTONE CELEBRATION */
  #milestone { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; z-index: 25; pointer-events: none; }
  #milestone.show { display: flex; animation: fadeOut 2.2s forwards; }
  @keyframes fadeOut { 0% { opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  #milestone-text { font-size: 36px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8), 0 4px 8px rgba(0,0,0,0.8); font-style: italic; letter-spacing: 1px; animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); text-align: center; padding: 0 20px; }
  #milestone-sub { font-size: 16px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-style: italic; }
  @keyframes pop-in { from { transform: scale(0.3); } to { transform: scale(1); } }

  /* GAME OVER */
  #gameover { position: absolute; inset: 0; background: rgba(10,5,3,0.92); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 30; padding: 20px; backdrop-filter: blur(4px); }
  #gameover.show { display: flex; }
  #gameover h2 { font-size: 30px; color: #ffd89b; text-align: center; font-style: italic; }
  #gameover p { font-size: 15px; text-align: center; color: #f5e6d3; line-height: 1.4; max-width: 320px; font-style: italic; }
  #gameover .final { font-size: 56px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.6); font-family: -apple-system, sans-serif; }
  #gameover .stars { font-size: 28px; letter-spacing: 4px; }
  .restart { padding: 14px 36px; background: linear-gradient(180deg, #ffd89b, #c9a87c); color: #2a1810; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 0 #6b4423; font-family: -apple-system, sans-serif; }
  .restart:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b4423; }
  .share { padding: 10px 22px; background: transparent; color: #ffd89b; border: 1.5px solid #6b4423; border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: -apple-system, sans-serif; }

  /* FLAG WAVE */
  .flag { position: absolute; bottom: 200px; opacity: 0; font-size: 24px; animation: rise 2s ease-out forwards; pointer-events: none; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0) rotate(0deg); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-200px) rotate(360deg); } }
</style>
</head>
<body>
<div id="game">
  <div id="bunting"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header>
    <h1>🍰 <span class="accent">CHELSEA</span> TIRAMISU</h1>
    <div class="stats">
      <div class="stat"><span class="stat-label">Length</span><span class="stat-value" id="length">0m</span></div>
      <div class="stat"><span class="stat-label">Combo</span><span class="stat-value" id="combo">×1</span></div>
      <div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="lives">♥♥♥</span></div>
    </div>
  </header>
  <div id="stage">
    <svg id="townhall" viewBox="0 0 280 100" preserveAspectRatio="xMidYMax meet">
      <rect x="20" y="40" width="240" height="60" fill="#000"/>
      <rect x="0" y="60" width="280" height="40" fill="#000"/>
      <polygon points="100,40 140,10 180,40" fill="#000"/>
      <rect x="135" y="10" width="10" height="20" fill="#000"/>
      <rect x="40" y="55" width="8" height="20" fill="#3d2817"/>
      <rect x="60" y="55" width="8" height="20" fill="#3d2817"/>
      <rect x="80" y="55" width="8" height="20" fill="#3d2817"/>
      <rect x="195" y="55" width="8" height="20" fill="#3d2817"/>
      <rect x="215" y="55" width="8" height="20" fill="#3d2817"/>
      <rect x="235" y="55" width="8" height="20" fill="#3d2817"/>
      <rect x="130" y="65" width="20" height="35" fill="#3d2817"/>
    </svg>
    <div id="crowd"></div>

    <div id="record-bar">
      <div id="record-fill"></div>
      <div id="record-text">0% of 275m record</div>
    </div>

    <div id="nonna">
      <svg id="nonna-svg" viewBox="0 0 64 64">
        <ellipse cx="32" cy="40" rx="22" ry="20" fill="#f5d4a8"/>
        <path d="M10 36 Q32 8 54 36 L54 28 Q32 4 10 28 Z" fill="#5a4a4a"/>
        <circle cx="24" cy="38" r="2" fill="#1a0e08" id="eye-l"/>
        <circle cx="40" cy="38" r="2" fill="#1a0e08" id="eye-r"/>
        <path d="M24 48 Q32 52 40 48" stroke="#8b3a3a" stroke-width="2" fill="none" id="mouth"/>
        <ellipse cx="32" cy="44" rx="3" ry="2" fill="#d99a8a"/>
        <circle cx="14" cy="42" r="3" fill="#cd212a"/>
        <rect x="13" y="42" width="2" height="6" fill="#cd212a"/>
      </svg>
    </div>
    <div id="bubble">Andiamo!</div>

    <div id="meter">
      <div id="meter-label">Tap when marker hits green</div>
      <div id="meter-zones">
        <div class="zone bad"></div>
        <div class="zone good"></div>
        <div class="zone perfect"></div>
        <div class="zone good"></div>
        <div class="zone bad"></div>
      </div>
      <div id="meter-marker"></div>
    </div>

    <div id="tray"><div id="tiramisu"></div></div>
    <div id="toast"></div>

    <div id="milestone">
      <div id="milestone-text"></div>
      <div id="milestone-sub"></div>
    </div>

    <div id="espresso" title="Espresso boost — slows the meter for 5 layers">☕</div>

    <div id="controls">
      <button class="btn btn-lady" data-type="lady"><span class="btn-icon">🍪</span>Savoiardi</button>
      <button class="btn btn-cream" data-type="cream"><span class="btn-icon">🥛</span>Mascarpone</button>
      <button class="btn btn-cocoa" data-type="cocoa"><span class="btn-icon">🍫</span>Cacao</button>
    </div>

    <div id="gameover">
      <h2 id="go-title">Servizio finito!</h2>
      <p>Your tiramisu measured</p>
      <div class="final" id="final-length">0m</div>
      <div class="stars" id="stars"></div>
      <p id="verdict"></p>
      <button class="restart" onclick="restart()">Ancora! Play Again</button>
      <button class="share" onclick="share()">📤 Share Score</button>
    </div>
  </div>
</div>
<script>
const ORDER = ['lady','cream','lady','cream','cocoa'];
const NAMES = { lady:'Savoiardi', cream:'Mascarpone', cocoa:'Cacao' };
const CM = { lady:140, cream:100, cocoa:60 };
const RECORD = 27500;

const PHRASES = {
  perfect: ['Perfetto! 👌','Mamma mia, bellissimo!','Magnifico!','Squisito!','Che meraviglia!','Bravo, caro!','Buonissimo!','Eccellente!','Da Michelin!','Che bellezza!'],
  good: ['Va bene…','Not bad, eh','Decent.','Acceptable.','Continua!','Più veloce!'],
  bad: ['Disastro!','Madonna mia!','Che peccato!','Mio Dio!','Sloppy, caro mio.','Pasticcio!'],
  wrong: ['MA CHE FAI?!','NO NO NO!','Non così, stupido!','Where you learn cook?!','Wrong layer, idiota!','Ma sei matto?!'],
  start: ['Andiamo!','Forza!','Il Chelsea ti aspetta!','Beat 275 metri!'],
  combo3: ['Tre di fila! 🔥','On a roll, caro!','Mamma is impressed!'],
  combo5: ['CINQUE PERFETTI! ☕','Espresso unlocked!','You earn the ☕!'],
  combo7: ['MAGNIFICO STREAK!','Sette! La nonna piange!'],
};

const MILESTONES = [
  { m: 5, text: 'Cinque metri!', sub: 'The queue notices you' },
  { m: 10, text: '10 metri!', sub: 'Sloane Square applauds' },
  { m: 25, text: 'VENTICINQUE!', sub: 'The Mayor lifts an eyebrow' },
  { m: 50, text: 'MEZZO CENTINAIO!', sub: 'King\'s Road is buzzing' },
  { m: 100, text: 'CENTO METRI! 🎉', sub: 'Italian embassy calls' },
  { m: 150, text: '150 METRI!', sub: 'Vogue Italia wants photos' },
  { m: 200, text: 'DUECENTO!', sub: 'Guinness adjudicator arrives' },
  { m: 250, text: 'QUASI! 250m', sub: 'Just 25 metres to go!' },
  { m: 275, text: '🏆 NUOVO RECORD! 🏆', sub: 'YOU BEAT 275 METRES!' },
  { m: 300, text: '300 METRI!', sub: 'Rome demands a statue' },
  { m: 400, text: '400 METRI!', sub: 'Italy declares a holiday' },
  { m: 500, text: 'LEGGENDARIO!', sub: 'The Pope sends his blessing' },
];

let state;
const $ = id => document.getElementById(id);
const tiramisu = $('tiramisu'), tray = $('tray'), marker = $('meter-marker');
const lengthEl = $('length'), comboEl = $('combo'), livesEl = $('lives');
const recordFill = $('record-fill'), recordText = $('record-text');
const toast = $('toast'), bubble = $('bubble'), nonna = $('nonna');
const milestone = $('milestone'), msText = $('milestone-text'), msSub = $('milestone-sub');
const espressoBtn = $('espresso'), gameover = $('gameover');
const finalLength = $('final-length'), verdict = $('verdict'), stars = $('stars');
const eyeL = $('eye-l'), eyeR = $('eye-r'), mouth = $('mouth');

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function fmtLen(cm) { if (cm < 100) return cm.toFixed(0) + 'cm'; return (cm / 100).toFixed(cm < 1000 ? 2 : 1) + 'm'; }

function init() {
  state = {
    layers: 0, length: 0, combo: 1, maxCombo: 1, lives: 3, orderIdx: 0,
    markerPos: 0, markerDir: 1, baseSpeed: 0.9, speed: 0.9,
    perfects: 0, totalTaps: 0, espresso: 0, espressoActive: 0,
    milestonesShown: new Set(), running: true,
  };
  tiramisu.innerHTML = '';
  buildCrowd(8);
  updateUI();
  gameover.classList.remove('show');
  espressoBtn.classList.remove('show');
  setNonna('happy', pick(PHRASES.start));
  requestAnimationFrame(tick);
}

function buildCrowd(n) {
  const crowd = $('crowd');
  crowd.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'head';
    h.style.left = (5 + i * (90 / n) + Math.random() * 4) + '%';
    h.style.bottom = Math.random() * 4 + 'px';
    h.style.transform = `scale(${0.85 + Math.random() * 0.3})`;
    crowd.appendChild(h);
  }
}

function updateUI() {
  lengthEl.textContent = fmtLen(state.length);
  comboEl.textContent = '×' + state.combo;
  livesEl.textContent = '♥'.repeat(state.lives) + '♡'.repeat(3 - state.lives);
  const pct = Math.min(100, (state.length / RECORD) * 100);
  recordFill.style.width = pct + '%';
  recordText.textContent = pct.toFixed(1) + '% of 275m record';
}

function tick() {
  if (!state.running) return;
  const eff = state.espressoActive > 0 ? state.speed * 0.4 : state.speed;
  state.markerPos += state.markerDir * eff;
  if (state.markerPos >= 100) { state.markerPos = 100; state.markerDir = -1; }
  if (state.markerPos <= 0) { state.markerPos = 0; state.markerDir = 1; }
  marker.style.left = state.markerPos + '%';
  requestAnimationFrame(tick);
}

function showToast(msg, color) {
  toast.textContent = msg;
  toast.style.background = color || 'rgba(255,216,155,0.97)';
  toast.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove('show'), 900);
}

function setNonna(mood, line) {
  nonna.classList.remove('happy','sad','furious');
  nonna.classList.add(mood);
  if (mood === 'happy') { mouth.setAttribute('d','M24 46 Q32 54 40 46'); eyeL.setAttribute('r','2'); eyeR.setAttribute('r','2'); }
  else if (mood === 'sad') { mouth.setAttribute('d','M24 52 Q32 46 40 52'); eyeL.setAttribute('r','1.5'); eyeR.setAttribute('r','1.5'); }
  else { mouth.setAttribute('d','M24 50 L40 50'); eyeL.setAttribute('r','2.5'); eyeR.setAttribute('r','2.5'); }
  if (line) {
    bubble.textContent = line;
    bubble.classList.add('show');
    clearTimeout(setNonna.t);
    setNonna.t = setTimeout(() => bubble.classList.remove('show'), 1400);
  }
}

function spawnParticles(x, y, emojis, count) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = pick(emojis);
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    p.style.setProperty('--dy', (-Math.random() * 80 - 30) + 'px');
    $('stage').appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

function showMilestone(text, sub) {
  msText.textContent = text;
  msSub.textContent = sub;
  milestone.classList.remove('show');
  void milestone.offsetWidth;
  milestone.classList.add('show');
  for (let i = 0; i < 8; i++) {
    const f = document.createElement('div');
    f.className = 'flag';
    f.textContent = pick(['🇮🇹','🍰','🎉','⭐']);
    f.style.left = (10 + Math.random() * 80) + '%';
    f.style.animationDelay = (Math.random() * 0.5) + 's';
    $('stage').appendChild(f);
    setTimeout(() => f.remove(), 2200);
  }
  if (navigator.vibrate) navigator.vibrate([20, 40, 20, 40, 60]);
}

function checkMilestones() {
  const m = state.length / 100;
  for (const ms of MILESTONES) {
    if (m >= ms.m && !state.milestonesShown.has(ms.m)) {
      state.milestonesShown.add(ms.m);
      showMilestone(ms.text, ms.sub);
      if (state.lives < 3 && (ms.m === 100 || ms.m === 275)) state.lives = Math.min(3, state.lives + 1);
      buildCrowd(Math.min(40, 8 + Math.floor(m / 10)));
    }
  }
}

function place(type) {
  if (!state.running) return;
  state.totalTaps++;
  const expected = ORDER[state.orderIdx];
  const correctOrder = type === expected;
  const p = state.markerPos;
  let quality, mult, label;
  if (p >= 40 && p <= 60) { quality = 'perfect'; mult = 2.2; label = 'PERFETTO!'; }
  else if (p >= 20 && p <= 80) { quality = 'good'; mult = 1.0; label = 'Va bene'; }
  else { quality = 'bad'; mult = 0.4; label = 'Sloppy'; }

  if (!correctOrder) {
    state.lives--;
    state.combo = 1;
    setNonna('furious', pick(PHRASES.wrong));
    showToast('❌ Wrong layer! Lost a life', 'rgba(220,100,100,0.97)');
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    if (state.lives <= 0) return endGame();
    updateUI();
    return;
  }

  if (quality === 'perfect') { state.combo = Math.min(state.combo + 1, 9); state.perfects++; }
  else if (quality === 'good') state.combo = Math.max(1, state.combo);
  else state.combo = 1;
  state.maxCombo = Math.max(state.maxCombo, state.combo);

  const gained = CM[type] * mult * (1 + (state.combo - 1) * 0.18);
  state.length += gained;

  const div = document.createElement('div');
  div.className = 'layer ' + type + (quality === 'perfect' ? ' perfect' : '');
  div.style.minWidth = (40 * (0.8 + mult * 0.4)) + 'px';
  tiramisu.appendChild(div);
  state.layers++;
  state.orderIdx = (state.orderIdx + 1) % ORDER.length;
  state.speed = Math.min(3.2, state.baseSpeed + state.layers * 0.035);

  if (state.espressoActive > 0) state.espressoActive--;

  let line = pick(PHRASES[quality]);
  let mood = quality === 'perfect' ? 'happy' : quality === 'bad' ? 'sad' : 'happy';
  if (quality === 'perfect' && state.combo === 3) line = pick(PHRASES.combo3);
  if (quality === 'perfect' && state.combo === 5) { line = pick(PHRASES.combo5); state.espresso++; espressoBtn.classList.add('show'); }
  if (quality === 'perfect' && state.combo === 7) line = pick(PHRASES.combo7);
  setNonna(mood, line);

  showToast(label + ' +' + fmtLen(gained) + (state.combo > 1 ? ' ×' + state.combo : ''),
    quality === 'perfect' ? 'rgba(140,230,160,0.97)' : quality === 'good' ? 'rgba(255,216,155,0.97)' : 'rgba(220,180,100,0.95)');

  if (quality === 'perfect') {
    const rect = tray.getBoundingClientRect();
    spawnParticles(rect.right - 80, rect.top + 30, ['✨','⭐','🍰','💫'], 6);
  }
  if (navigator.vibrate) navigator.vibrate(quality === 'perfect' ? [10,20,10,20,10] : quality === 'good' ? 15 : 25);

  tray.scrollTo({ left: tray.scrollWidth, behavior: 'smooth' });
  updateUI();
  checkMilestones();
}

function useEspresso() {
  if (state.espresso <= 0) return;
  state.espresso--;
  state.espressoActive = 5;
  if (state.espresso <= 0) espressoBtn.classList.remove('show');
  showToast('☕ ESPRESSO! Meter slowed for 5 layers', 'rgba(110,70,40,0.97)');
  setNonna('happy', 'Bevi! Forza ora!');
  spawnParticles(window.innerWidth - 60, window.innerHeight - 130, ['☕','💨'], 5);
  if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
}

function endGame() {
  state.running = false;
  finalLength.textContent = fmtLen(state.length);
  const m = state.length / 100;
  let v = '', title = 'Servizio finito!', s = 0;
  if (m < 5) { v = 'Barely a dessert. La nonna sighs deeply. 😔'; s = 0; }
  else if (m < 25) { v = 'A modest start. Chelsea expected more.'; s = 1; }
  else if (m < 75) { v = 'Respectable! But the record laughs.'; s = 2; }
  else if (m < 150) { v = 'Halfway hero! The crowd cheers.'; s = 3; }
  else if (m < 275) { v = 'Tantalisingly close to 275m. Try again, caro!'; s = 4; }
  else if (m < 400) { title = '🏆 NUOVO RECORD! 🏆'; v = 'You DEMOLISHED 275m. Chelsea Town Hall is on its feet!'; s = 5; }
  else { title = '🏆 LEGGENDA! 🏆'; v = m.toFixed(0) + 'm of pure tiramisu glory. La nonna weeps with joy.'; s = 5; }
  $('go-title').textContent = title;
  verdict.textContent = v;
  stars.textContent = '⭐'.repeat(s) + '☆'.repeat(5 - s);
  gameover.classList.add('show');
}

function restart() { init(); }

async function share() {
  const m = state.length / 100;
  const text = `🍰 I built a ${m.toFixed(2)}m tiramisu at Chelsea Town Hall! ${m >= 275 ? '🏆 NEW WORLD RECORD!' : `(${(m/275*100).toFixed(0)}% of the 275m record)`} Beat me: https://hugo-bramble.github.io/tiramisu-game/`;
  try {
    if (navigator.share) await navigator.share({ title: 'Chelsea Tiramisu Challenge', text });
    else { await navigator.clipboard.writeText(text); showToast('Copied to clipboard!'); }
  } catch (e) {}
}

document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('touchstart', e => { e.preventDefault(); place(b.dataset.type); }, { passive: false });
  b.addEventListener('click', e => { if (!('ontouchstart' in window)) place(b.dataset.type); });
});
espressoBtn.addEventListener('touchstart', e => { e.preventDefault(); useEspresso(); }, { passive: false });
espressoBtn.addEventListener('click', e => { if (!('ontouchstart' in window)) useEspresso(); });

function highlightNext() {
  document.querySelectorAll('.btn').forEach(b => {
    b.classList.toggle('next-up', state && state.running && b.dataset.type === ORDER[state.orderIdx]);
  });
}
setInterval(highlightNext, 100);

document.addEventListener('gesturestart', e => e.preventDefault());

init();
</script>
</body>
</html>
